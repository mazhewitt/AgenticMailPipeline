[package]
name = "agentic-mail-agent"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A modular, async-ready CLI agent for Gmail using google-apis-rs."
license = "MIT"

[dependencies]
async-trait = "0.1"
google-gmail1 = "*"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
yup-oauth2 = "*"
hyper = { version = "*", features = ["client", "http1"] }
hyper-util = { version = "*", features = ["client", "client-legacy"] }
hyper-rustls = { version = "*", features = ["ring"] }
rustls = { version = "*", features = ["ring"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
rand = "0.8"
langchain-rust = { version = "4.6.0", features = ["ollama"] }
ollama-rs = "0.2"
