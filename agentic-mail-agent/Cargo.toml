[package]
name = "agentic-mail-agent"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A modular, async-ready CLI agent for Gmail using google-apis-rs."
license = "MIT"

[dependencies]
async-trait = "0.1"
google-gmail1 = { path = "../../google-apis-rs/gen/gmail1" }
tokio = { workspace = true }
thiserror = "2.0.12"
# Use the yup-oauth2 version from google-gmail1 for compatibility
hyper = { version = "1.6.0", features = ["full"] }
hyper-rustls = "0.27.7"
rustls = { version = "*", features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.9.1"
langchain-rust = { version = "4.6.0", features = ["ollama"] }
ollama-rs = "0.2.2"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.22"
regex = "1.0"
lazy_static = "1.4"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
html2text = "0.4.1"

# Test configuration for different test categories
# Run with: cargo test --test unit --test ollama --test gmail --test integration

# Unit tests - no external dependencies, fast execution
[[test]]
name = "unit"
path = "tests/unit/mod.rs"

# Ollama tests - require local Ollama server
[[test]]
name = "ollama"
path = "tests/ollama/mod.rs"

# Gmail tests - require Gmail API credentials
[[test]]
name = "gmail"
path = "tests/gmail/mod.rs"

# Integration tests - require both Gmail and Ollama
[[test]]
name = "integration"
path = "tests/integration/mod.rs"

# Custom build commands for CI/CD pipeline
[package.metadata.scripts]
# Full CI pipeline: test, clippy, audit
ci = "cargo test --all && cargo clippy --all-targets --all-features -- -D warnings && cargo audit"
# Quick check: test and clippy only
check = "cargo test --all && cargo clippy --all-targets --all-features -- -D warnings"
# Security audit only
audit = "cargo audit"
